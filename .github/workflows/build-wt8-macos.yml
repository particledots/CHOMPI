# UNTESTED convenience: builds the WT8 AU/VST3/Standalone on a GitHub-hosted Mac and uploads a zip.
# Run it from the Actions tab (Run workflow), or it runs on pushes that touch wt8-plugin/.
name: build-wt8-macos
on:
  workflow_dispatch:
  push:
    paths: ['wt8-plugin/**']
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S wt8-plugin -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Headless tests
        run: |
          ./build/render_test wt8-plugin/wavetables build/render_test_out.wav
          ./build/plugin_test
          ./build/rate_test wt8-plugin/wavetables
          ./build/seq_test
      - name: Verify universal binary (arm64 + x86_64)
        run: |
          fail=0; n=0
          echo "::notice title=artefacts::$(find build/WT8_artefacts -maxdepth 4 -name 'ipmohc*' | tr '\n' ' ')"
          for bin in $(find build/WT8_artefacts -path '*Contents/MacOS/ipmohc' -type f); do
            n=$((n+1))
            archs=$(lipo -archs "$bin" 2>&1)
            echo "::notice title=lipo::$bin => $archs"
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) fail=1;; esac
          done
          echo "::notice title=cmake-archs::$(grep -m1 CMAKE_OSX_ARCHITECTURES build/CMakeCache.txt)"
          [ "$n" -ge 1 ] || { echo "NO BINARIES FOUND"; exit 1; }
          [ "$fail" = 0 ] || { echo "NOT UNIVERSAL"; exit 1; }
      - name: Package
        run: |
          mkdir out
          cp -R build/WT8_artefacts/Release/AU/ipmohc.component out/
          cp -R build/WT8_artefacts/Release/VST3/ipmohc.vst3 out/ || true
          cd out && zip -ry ../ipmohc-macos.zip .
      - uses: actions/upload-artifact@v4
        with: { name: ipmohc-macos, path: ipmohc-macos.zip }
